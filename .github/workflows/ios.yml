name: Validate Faithful Keys iPhone app
on:
  push:
    branches: [codex/iphone-app, main]
    paths: ['ios/**', 'app/midi/**', 'vite.ios.config.ts', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iphone-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iphone:
    # Standard public-repository runners only; no signing service or paid runner.
    if: github.event.repository.private == false
    permissions:
      contents: write
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ios && pnpm typecheck
      - run: command -v ffmpeg || brew install ffmpeg
      - run: pnpm build:ios && pnpm desktop:assets && pnpm ios:prepare
      - name: Build for an iPhone without a signing identity
        run: xcodebuild -project ios/FaithfulKeys.xcodeproj -scheme FaithfulKeys -configuration Release -destination 'generic/platform=iOS' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Test on an iPhone simulator
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if v["name"].startswith("iPhone")))')
          xcodebuild -project ios/FaithfulKeys.xcodeproj -scheme FaithfulKeys -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath ios/build -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - name: Package a ready-to-open Xcode project
        run: node ios/package.mjs
      - name: Publish tested iPhone project preview
        if: github.event_name == 'push' && github.ref_name == 'codex/iphone-app'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = `iphone-preview-${context.sha.slice(0, 7)}`;
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            let release = releases.find(r => r.tag_name === tag);
            if (release && !release.draft) {
              core.notice('This exact source preview is already published.');
              return;
            }
            if (!release) {
              release = (await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, target_commitish: context.sha,
                name: 'Faithful Keys for iPhone — Xcode project preview',
                body: 'Native iPhone app with USB and Bluetooth MIDI, offline sounds and local progress. Download FaithfulKeys-iPhone-Xcode.zip, unzip it on a Mac with Xcode 16 or later, and follow START-HERE.md. The resources are already bundled; no Node setup is needed. Apple signing is required to install on a real iPhone. This is not a signed IPA or an App Store/TestFlight release. Native build and simulator checks passed; physical keyboard pairing and latency still require hardware testing.\n\nSource commit: ' + context.sha,
                draft: true, prerelease: true,
              })).data;
            }
            const assets = (await github.rest.repos.listReleaseAssets({ ...context.repo, release_id: release.id })).data;
            for (const asset of assets.filter(a => a.name === 'FaithfulKeys-iPhone-Xcode.zip')) {
              await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: asset.id });
            }
            await github.rest.repos.uploadReleaseAsset({
              ...context.repo, release_id: release.id, name: 'FaithfulKeys-iPhone-Xcode.zip',
              data: fs.readFileSync('ios/FaithfulKeys-iPhone-Xcode.zip'),
            });
            await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, draft: false, prerelease: true, make_latest: 'false' });
