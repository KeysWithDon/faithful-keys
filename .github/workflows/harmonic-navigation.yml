name: Harmonic Navigation checks
on:
  push:
    branches:
      - feature/harmonic-navigation-teacher
  pull_request:
    paths:
      - 'app/harmonic-navigation*'
      - 'app/page.tsx'
      - 'tests/harmonic-navigation.test.ts'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node --test --experimental-strip-types tests/harmonic-navigation.test.ts
      - run: pnpm build:pages
