name: Build Faithful Keys desktop downloads
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - desktop/**
      - vite.desktop.config.ts
      - .github/workflows/desktop.yml
permissions:
  contents: write
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  prepare:
    # Standard runners are free in public repositories. Never incur private-repo minutes.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        id: release
        with:
          script: |
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const tag = `desktop-v${pkg.version}`;
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            let release = releases.find(r => r.tag_name === tag);
            if (release && !release.draft) throw new Error(`${tag} is already published. Bump package.json version.`);
            const body = fs.readFileSync('desktop/RELEASE_NOTES.md', 'utf8') + `\n\nSource commit: ${context.sha}`;
            if (release) {
              release = (await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, target_commitish: context.sha, body })).data;
            } else {
              release = (await github.rest.repos.createRelease({ ...context.repo, tag_name: tag, target_commitish: context.sha, name: `Faithful Keys Desktop ${pkg.version}`, body, draft: true, prerelease: false })).data;
            }
            core.setOutput('release_id', release.id);
            core.setOutput('tag', tag);
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            arch: x64
            executable: release/win-unpacked/Faithful Keys.exe
          - os: macos-15-intel
            platform: mac
            arch: x64
            executable: release/mac/Faithful Keys.app/Contents/MacOS/Faithful Keys
          - os: macos-15
            platform: mac
            arch: arm64
            executable: release/mac-arm64/Faithful Keys.app/Contents/MacOS/Faithful Keys
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Same public browser configuration already used by the Pages build.
      VITE_SUPABASE_URL: https://lvyegmzznvqvvihexuix.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ElTjPwkKeA-3m9HSf8g_ow_cSI5GScK
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:desktop
      - run: pnpm build:desktop
      - run: pnpm desktop:assets
      - run: pnpm desktop:stage
      - run: pnpm desktop:package --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Verify native packaged application offline
        run: pnpm smoke:desktop
        env:
          FK_DESKTOP_EXECUTABLE: ${{ matrix.executable }}
      - name: Validate Mac bundle signature and minimum OS
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          bundle="$(dirname "$(dirname "$(dirname "$FK_DESKTOP_EXECUTABLE")")")"
          codesign --verify --deep --strict "$bundle"
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$bundle/Contents/Info.plist"
        env:
          FK_DESKTOP_EXECUTABLE: ${{ matrix.executable }}
      - run: node desktop/checksums.mjs
      - name: Upload directly to draft release (no Actions artifact storage)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          for file in release/*.exe release/*.dmg release/*.zip release/verification-*.json release/SHA256SUMS-*.txt; do
            if [ -f "$file" ]; then gh release upload "$RELEASE_TAG" "$file" --clobber --repo "$GITHUB_REPOSITORY"; fi
          done
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...context.repo, release_id });
            const names = assets.map(a => a.name);
            for (const suffix of ['win-x64.exe', 'mac-x64.dmg', 'mac-arm64.dmg', 'verification-win32-x64.json', 'verification-darwin-x64.json', 'verification-darwin-arm64.json']) {
              if (!names.some(n => n.endsWith(suffix))) throw new Error(`Missing verified release asset: ${suffix}`);
            }
            const release = await github.rest.repos.updateRelease({ ...context.repo, release_id, draft: false, make_latest: 'true' });
            core.summary.addHeading('Faithful Keys desktop downloads').addLink('Download for Mac and Windows', release.data.html_url).write();
